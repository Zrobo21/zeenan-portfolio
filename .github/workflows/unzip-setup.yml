name: One-Time Unzip Setup

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip site package (merges into existing folders, overwrites matching files)
        run: |
          if [ ! -f gta-portfolio-site.zip ]; then
            echo "ERROR: gta-portfolio-site.zip not found in repo root."
            exit 1
          fi
          unzip -o gta-portfolio-site.zip -d _extracted_tmp
          rsync -a _extracted_tmp/gta-portfolio/ ./
          rm -rf _extracted_tmp
          rm -f gta-portfolio-site.zip

      - name: Commit extracted files
        run: |
          git config user.name "setup-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Extract/update site files from zip package"
          git push
