name: Auto Unzip

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip files
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted

      - name: Move extracted files
        run: |
          cp -r extracted/* .
          rm -rf extracted

      - name: Remove ZIP files
        run: |
          rm -f *.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automatically unzip project" || echo "No changes to commit"
          git push
