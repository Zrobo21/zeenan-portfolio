title: "ZEENAN | DIGITAL MARKETING"
description: "Digital Marketing Consultant — NSDA Level 3 Certified"
author: "Haa Meem Ul Karim Zeenan"
baseurl: ""
url: ""

markdown: kramdown
permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - scripts/
  - README.md
  - requirements.txt
